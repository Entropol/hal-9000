<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="Helvetica, Arial, sans-serif">
<title>HAL 9000 devre şeması</title>
<desc>CrowPanel 2.8 ESP32 kartına INMP441 mikrofon, buton, 50 mm hoparlör, microSD kart ve 5V adaptörün bağlantısı.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.tt .th{fill:#085041}.tt .ts{fill:#0F6E56}
.pp .th{fill:#3C3489}.pp .ts{fill:#534AB7}
.bx{fill:#F1EFE8;stroke:#888780;stroke-width:0.5}
.tt rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}
.pp rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}
</style></defs>
<rect width="680" height="430" fill="#FFFFFF"/>
<rect class="bx" x="230" y="40" width="220" height="330" rx="12"/>
<text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central">CrowPanel 2.8″</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">ESP32 kartı</text>
<g class="tt"><rect x="242" y="100" width="90" height="98" rx="6"/>
<text class="th" x="287" y="113" text-anchor="middle" dominant-baseline="central">GPIO_D</text>
<text class="ts" x="252" y="133" dominant-baseline="central">3V3</text>
<text class="ts" x="252" y="151" dominant-baseline="central">GND</text>
<text class="ts" x="252" y="169" dominant-baseline="central">IO25</text>
<text class="ts" x="252" y="187" dominant-baseline="central">IO32</text></g>
<g class="tt"><rect x="242" y="215" width="90" height="98" rx="6"/>
<text class="th" x="287" y="228" text-anchor="middle" dominant-baseline="central">I2C portu</text>
<text class="ts" x="252" y="248" dominant-baseline="central">IO22</text>
<text class="ts" x="252" y="266" dominant-baseline="central">IO21</text>
<text class="ts" x="252" y="284" dominant-baseline="central">3V3 (boş)</text>
<text class="ts" x="252" y="302" dominant-baseline="central">GND</text></g>
<g class="tt"><rect x="344" y="100" width="94" height="40" rx="6"/>
<text class="th" x="391" y="113" text-anchor="middle" dominant-baseline="central">Hoparlör</text>
<text class="ts" x="391" y="129" text-anchor="middle" dominant-baseline="central">IO26, amfi</text></g>
<g class="tt"><rect x="344" y="160" width="94" height="40" rx="6"/>
<text class="th" x="391" y="173" text-anchor="middle" dominant-baseline="central">microSD</text>
<text class="ts" x="391" y="189" text-anchor="middle" dominant-baseline="central">dahili yuva</text></g>
<g class="tt"><rect x="344" y="220" width="94" height="40" rx="6"/>
<text class="th" x="391" y="233" text-anchor="middle" dominant-baseline="central">USB-C</text>
<text class="ts" x="391" y="249" text-anchor="middle" dominant-baseline="central">5V giriş</text></g>
<g class="tt"><rect x="344" y="280" width="94" height="40" rx="6"/>
<text class="th" x="391" y="293" text-anchor="middle" dominant-baseline="central">Arka ışık</text>
<text class="ts" x="391" y="309" text-anchor="middle" dominant-baseline="central">IO27, göz</text></g>
<g class="pp"><rect x="40" y="100" width="130" height="134" rx="6"/>
<text class="th" x="80" y="113" text-anchor="middle" dominant-baseline="central">INMP441</text>
<text class="ts" x="162" y="133" text-anchor="end" dominant-baseline="central">VDD</text>
<text class="ts" x="162" y="151" text-anchor="end" dominant-baseline="central">GND</text>
<text class="ts" x="162" y="169" text-anchor="end" dominant-baseline="central">WS</text>
<text class="ts" x="162" y="187" text-anchor="end" dominant-baseline="central">SCK</text>
<text class="ts" x="162" y="205" text-anchor="end" dominant-baseline="central">SD</text>
<text class="ts" x="162" y="223" text-anchor="end" dominant-baseline="central">L/R → GND</text></g>
<g class="pp"><rect x="40" y="250" width="130" height="65" rx="6"/>
<text class="th" x="75" y="283" text-anchor="middle" dominant-baseline="central">Buton</text>
<text class="ts" x="162" y="266" text-anchor="end" dominant-baseline="central">bacak 1</text>
<text class="ts" x="162" y="302" text-anchor="end" dominant-baseline="central">bacak 2</text></g>
<rect class="bx" x="490" y="100" width="150" height="40" rx="6"/>
<text class="th" x="565" y="113" text-anchor="middle" dominant-baseline="central">Hoparlör 50 mm</text>
<text class="ts" x="565" y="129" text-anchor="middle" dominant-baseline="central">8Ω 0,5W, PH2.0 fiş</text>
<rect class="bx" x="490" y="160" width="150" height="40" rx="6"/>
<text class="th" x="565" y="173" text-anchor="middle" dominant-baseline="central">microSD kart</text>
<text class="ts" x="565" y="189" text-anchor="middle" dominant-baseline="central">FAT32</text>
<rect class="bx" x="490" y="220" width="150" height="40" rx="6"/>
<text class="th" x="565" y="233" text-anchor="middle" dominant-baseline="central">5V 2A adaptör</text>
<text class="ts" x="565" y="249" text-anchor="middle" dominant-baseline="central">USB-C kablo</text>
<line x1="170" y1="133" x2="242" y2="133" stroke="#E24B4A" stroke-width="1.5"/>
<line x1="170" y1="151" x2="242" y2="151" stroke="#888780" stroke-width="1.5"/>
<line x1="170" y1="169" x2="242" y2="169" stroke="#1D9E75" stroke-width="1.5"/>
<line x1="170" y1="187" x2="242" y2="187" stroke="#1D9E75" stroke-width="1.5"/>
<path d="M170 205 H205 V248 H242" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<line x1="170" y1="266" x2="242" y2="266" stroke="#1D9E75" stroke-width="1.5"/>
<line x1="170" y1="302" x2="242" y2="302" stroke="#888780" stroke-width="1.5"/>
<line x1="438" y1="120" x2="490" y2="120" stroke="#888780" stroke-width="1.5"/>
<line x1="490" y1="180" x2="440" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="490" y1="240" x2="440" y2="240" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="40" y1="398" x2="70" y2="398" stroke="#E24B4A" stroke-width="1.5"/>
<text class="ts" x="78" y="398" dominant-baseline="central">3V3 besleme</text>
<line x1="200" y1="398" x2="230" y2="398" stroke="#888780" stroke-width="1.5"/>
<text class="ts" x="238" y="398" dominant-baseline="central">GND / hoparlör</text>
<line x1="360" y1="398" x2="390" y2="398" stroke="#1D9E75" stroke-width="1.5"/>
<text class="ts" x="398" y="398" dominant-baseline="central">Sinyal</text>
</svg>
